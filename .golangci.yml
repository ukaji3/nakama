version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - revive
    - bodyclose
    - gosec
    - rowserrcheck

  settings:
    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: unused-parameter
          disabled: true

  exclusions:
    paths:
      - third_party
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    paths:
      - third_party

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ukaji3/nakama
