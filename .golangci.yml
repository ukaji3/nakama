# golangci-lint configuration for nakama.
#
# Keep this list reasonably strict but pragmatic; no opinion-only
# linters that would obstruct early development.

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - gofmt
    - goimports
    - revive
    - gosimple
    - bodyclose
    - rowserrcheck
    - gosec

linters-settings:
  goimports:
    local-prefixes: github.com/ukaji3/nakama
  revive:
    rules:
      - name: var-naming
      - name: error-return
      - name: error-naming
      - name: exported
        arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
      - name: unused-parameter
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
