name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum are not tidy"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Verify gofmt -s
        run: |
          out=$(gofmt -s -l . | grep -v '^third_party/' || true)
          if [ -n "$out" ]; then
            echo "::error::the following files are not gofmt -s formatted:"
            echo "$out"
            gofmt -s -d $out
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /tmp/nakama ./cmd/nakama

      - name: Smoke test (--help / version)
        run: |
          /tmp/nakama --help
          /tmp/nakama version

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      # -race is intentionally omitted on Windows: the race runtime
      # requires cgo (a working gcc toolchain) there, which the hosted
      # runner does not guarantee. Race coverage is provided by the
      # ubuntu job above.
      - name: Test (no -race)
        run: go test -count=1 ./...

      - name: Build
        run: go build -o nakama.exe ./cmd/nakama

      - name: Smoke test (--help / version)
        run: |
          .\nakama.exe --help
          .\nakama.exe version

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  third-party-notices:
    name: THIRD-PARTY-NOTICES freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      # Regenerates the notices from the module build graphs of all
      # release targets and fails when the committed file is stale
      # (dependency changed without `make notices`).
      - name: Verify THIRD-PARTY-NOTICES is up to date
        run: go run ./tools/gen-third-party-notices -check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      - name: Install golangci-lint (latest)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint --version
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  goreleaser-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: Validate config
        run: goreleaser check
      - name: Snapshot build (no publish)
        run: goreleaser release --snapshot --clean --skip=publish
