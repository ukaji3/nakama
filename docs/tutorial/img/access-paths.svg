<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="access-paths-title" aria-describedby="access-paths-desc" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif">
  <title id="access-paths-title">4 つのアクセス方法の使い分け</title>
  <desc id="access-paths-desc">ブラウザで開く open、ターミナルに入る connect、デスクトップのエディタから使う ssh、ポートを手元に持ってくる tunnel の 4 つがある。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" /></marker><marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#374151" /></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" /></marker></defs>
  <rect width="920" height="420" fill="#ffffff" />
  <text x="25" y="40" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="600" fill="#4b5563">コマンド</text>
  <text x="190" y="40" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="600" fill="#4b5563">できること</text>
  <text x="425" y="40" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="600" fill="#4b5563">通り道</text>
  <text x="640" y="40" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="600" fill="#4b5563">こんなときに</text>
  <rect x="25" y="55" width="155" height="60" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="102" y="88" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#111827">nakama aws open</text>
  <rect x="190" y="55" width="225" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="302" y="89" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#111827">ブラウザで VS Code を開く</text>
  <rect x="425" y="55" width="205" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="528" y="79" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">CloudFront 経由</text>
  <text x="528" y="98" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">(自分の IP の許可が必要)</text>
  <rect x="640" y="55" width="255" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="768" y="88" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">画面だけで完結したい</text>
  <rect x="25" y="127" width="155" height="60" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="102" y="160" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#111827">nakama aws connect</text>
  <rect x="190" y="127" width="225" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="302" y="161" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#111827">ターミナルに入る</text>
  <rect x="425" y="127" width="205" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="528" y="160" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">SSM 経由</text>
  <rect x="640" y="127" width="255" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="768" y="160" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">ログを見る・コマンドを叩く</text>
  <rect x="25" y="199" width="155" height="60" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="102" y="232" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#111827">nakama aws ssh</text>
  <rect x="190" y="199" width="225" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="302" y="233" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#111827">手元の VS Code / scp / git</text>
  <rect x="425" y="199" width="205" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="528" y="232" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">SSM 経由</text>
  <rect x="640" y="199" width="255" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="768" y="232" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">デスクトップのエディタを使いたい</text>
  <rect x="25" y="271" width="155" height="60" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="102" y="304" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#111827">nakama aws tunnel</text>
  <rect x="190" y="271" width="225" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="302" y="305" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#111827">ポートを手元に持ってくる</text>
  <rect x="425" y="271" width="205" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="528" y="304" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">SSM 経由</text>
  <rect x="640" y="271" width="255" height="60" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
  <text x="768" y="295" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">localhost:3000 で</text>
  <text x="768" y="314" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#111827">開発サーバーを見る</text>
  <rect x="25" y="350" width="870" height="55" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
  <text x="460" y="372" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="600" fill="#111827">open だけが CloudFront (インターネット) 経由で、IP の許可が必要です</text>
  <text x="460" y="392" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">connect / ssh / tunnel は SSM 経由なので IP 許可は不要です (AWS の権限で守られます)</text>
</svg>
