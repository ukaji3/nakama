<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="overview-title" aria-describedby="overview-desc" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif">
  <title id="overview-title">nakama の全体像</title>
  <desc id="overview-desc">手元の PC のブラウザは CloudFront と WAF を通って AWS 上の code-server に つながり、nakama CLI は AWS API と SSM Session Manager を通ってインスタンスを 操作する。インスタンスからインターネットへの通信は NAT インスタンスを経由する。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" /></marker><marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#374151" /></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" /></marker></defs>
  <rect width="900" height="440" fill="#ffffff" />
  <rect x="20" y="55" width="200" height="290" rx="12" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="32" y="75" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="600" fill="#4b5563">あなたの PC</text>
  <rect x="35" y="90" width="170" height="70" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2" />
  <text x="120" y="119" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" font-weight="600" fill="#111827">ブラウザ</text>
  <text x="120" y="140" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#4b5563">Edge / Chrome</text>
  <rect x="35" y="250" width="170" height="70" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="2" />
  <text x="120" y="279" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" font-weight="600" fill="#111827">nakama CLI</text>
  <text x="120" y="300" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#4b5563">コマンド操作</text>
  <rect x="260" y="30" width="620" height="330" rx="12" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="272" y="50" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="600" fill="#4b5563">AWS (ap-northeast-1 / 東京)</text>
  <rect x="300" y="90" width="190" height="70" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
  <text x="395" y="119" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" font-weight="600" fill="#111827">CloudFront + WAF</text>
  <text x="395" y="140" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#4b5563">許可した IP だけ通す</text>
  <rect x="620" y="160" width="220" height="90" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
  <text x="730" y="188" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" font-weight="600" fill="#111827">EC2 インスタンス</text>
  <text x="730" y="210" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#4b5563">code-server (VS Code)</text>
  <text x="730" y="230" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#4b5563">プライベートサブネット</text>
  <rect x="300" y="250" width="190" height="70" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
  <text x="395" y="279" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" font-weight="600" fill="#111827">SSM Session Manager</text>
  <text x="395" y="300" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#4b5563">SSH なしで中に入る</text>
  <rect x="620" y="296" width="220" height="56" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2" />
  <text x="730" y="318" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="15" font-weight="600" fill="#111827">NAT インスタンス</text>
  <text x="730" y="339" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="400" fill="#4b5563">外向き通信のみ</text>
  <line x1="205" y1="120" x2="296" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="250" y="112" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#374151">HTTPS</text>
  <line x1="492" y1="132" x2="616" y2="172" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="500" y="196" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="400" fill="#4b5563">VPC Origin (HTTP)</text>
  <line x1="205" y1="280" x2="296" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="250" y="272" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#374151">AWS API</text>
  <line x1="492" y1="272" x2="616" y2="248" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="500" y="300" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="400" fill="#4b5563">SSH なし・ポート開放なし</text>
  <line x1="730" y1="250" x2="730" y2="292" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="740" y="276" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="400" fill="#4b5563">apt / git などの通信</text>
  <line x1="730" y1="354" x2="730" y2="386" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <text x="730" y="402" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="400" fill="#4b5563">インターネット</text>
  <text x="20" y="380" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">受信ポートの開放は不要 (インスタンスは公開 IP を持ちません)</text>
  <text x="20" y="403" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">パスワードは AWS 側に保管され、PC には保存されません</text>
</svg>
