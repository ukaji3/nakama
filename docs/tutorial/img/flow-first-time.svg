<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="flow-first-time-title" aria-describedby="flow-first-time-desc" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif">
  <title id="flow-first-time-title">初回セットアップの流れ</title>
  <desc id="flow-first-time-desc">サインイン、基盤の作成、自分の IP の許可、開発環境の作成、ブラウザで開く、の 5 ステップで開発を始められる。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" /></marker><marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#374151" /></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c" /></marker></defs>
  <rect width="920" height="250" fill="#ffffff" />
  <rect x="20" y="60" width="155" height="95" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="98" y="92" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="600" fill="#111827">1. サインイン</text>
  <text x="98" y="112" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">nakama aws login</text>
  <text x="98" y="132" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">ブラウザで承認</text>
  <rect x="54" y="168" width="67" height="24" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="88" y="185" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="600" fill="#111827">約 1 分</text>
  <line x1="178" y1="107" x2="198" y2="107" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="200" y="60" width="155" height="95" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="278" y="92" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="600" fill="#111827">2. 基盤を作る</text>
  <text x="278" y="112" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">nakama aws init</text>
  <text x="278" y="132" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">1 回だけ (共有)</text>
  <rect x="234" y="168" width="67" height="24" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="268" y="185" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="600" fill="#111827">約 3 分</text>
  <line x1="358" y1="107" x2="378" y2="107" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="380" y="60" width="155" height="95" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="458" y="92" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="600" fill="#111827">3. IP を許可</text>
  <text x="458" y="112" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">nakama aws acl add</text>
  <text x="458" y="132" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">自宅/会社ごとに</text>
  <rect x="414" y="168" width="48" height="24" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="438" y="185" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="600" fill="#111827">数秒</text>
  <line x1="538" y1="107" x2="558" y2="107" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="560" y="60" width="155" height="95" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="638" y="92" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="600" fill="#111827">4. 環境を作る</text>
  <text x="638" y="112" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">nakama aws create</text>
  <text x="638" y="132" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">1 人で何台でも</text>
  <rect x="594" y="168" width="74" height="24" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="631" y="185" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="600" fill="#111827">約 15 分</text>
  <line x1="718" y1="107" x2="738" y2="107" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="740" y="60" width="155" height="95" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="818" y="92" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="14" font-weight="600" fill="#111827">5. 使い始める</text>
  <text x="818" y="112" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">nakama aws open</text>
  <text x="818" y="132" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">ブラウザが開く</text>
  <rect x="774" y="168" width="48" height="24" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" />
  <text x="798" y="185" text-anchor="middle" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="600" fill="#111827">数秒</text>
  <text x="20" y="215" text-anchor="start" font-family="Segoe UI, Meiryo, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="400" fill="#4b5563">2 の init は AWS アカウントに 1 回だけ。3 は接続元のネットワークが変わったときに追加します。</text>
</svg>
